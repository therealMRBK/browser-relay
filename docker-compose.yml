services:
  app:
    build: .
    image: desktop-relay:latest
    container_name: desktop-relay
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8094}:3000"
    environment:
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1080}
      TARGET_FPS: ${TARGET_FPS:-24}
      DATA_DIR: /data
    volumes:
      - desktop-relay-data:/data
    shm_size: "1gb"
    # Passes the host's iGPU through for VAAPI hardware video decode (see
    # server.js's Chrome launch flags) -- omit this block if the host has no
    # /dev/dri (Chrome falls back to software decode/rendering either way,
    # just slower). Not needed for the audio pipeline, only video.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0

volumes:
  desktop-relay-data:
