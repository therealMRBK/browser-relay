services:
  app:
    build: .
    image: desktop-relay:latest
    container_name: desktop-relay
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8094}:3000"
    environment:
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1920}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-1080}
      TARGET_FPS: ${TARGET_FPS:-24}
      DATA_DIR: /data
    volumes:
      - desktop-relay-data:/data
    shm_size: "1gb"
    # Plain `node server.js` as PID 1 never reaps orphaned grandchild
    # processes (no init system does that for it) -- when Chrome's own
    # top-level process dies (crash, OOM, a bad GPU/device passthrough), its
    # already-running child processes (crashpad handlers, zygotes, renderers)
    # get reparented to PID 1 and sit there as <defunct> zombies forever,
    # since plain Node doesn't wait()/reap them. Confirmed hitting this for
    # real: ~300 accumulated after a repeated Chrome crash loop. Docker's
    # `--init` (tini as actual PID 1) fixes this structurally, for any future
    # crash scenario, not just the one that surfaced it.
    init: true
    # Passes the host's iGPU through: VAAPI H.264 encoding of the desktop video
    # (server.js "Video" block) and hardware video decode in Chrome. Omit this
    # block if the host has no /dev/dri: the encoder falls back to libx264 (CPU)
    # and Chrome to software decode by themselves, just using more CPU.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0

volumes:
  desktop-relay-data:
